<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Don Carlos</title>

    <!-- Estilos básicos -->
    <style>
      body {
        text-align: center;
        font-family: "Montserrat", sans-serif;
        background: #f5f5f5;

        background-image: url("fondo.webp"); /* tu imagen */
        background-size: cover; /* cubre toda la pantalla */
        background-position: center; /* centra la imagen */
        background-repeat: no-repeat; /* evita que se repita */
        height: 100vh; /* altura completa */
        margin: 0;
      }

      h1 {
        color: #ffffff;
        font-size: 25px;
        width: 95%;
      }

      img {
        margin-top: 20px;
        border-radius: 10px;
      }

      button {
        width: 90%; /* ocupa 80% del ancho de pantalla */
        max-width: 400px; /* límite para que no sea gigante en PC */
        height: 60px;

        margin: 10px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #e30613;
        color: white;

        display: flex; /* 🔥 activa alineación moderna */
        align-items: center; /* centra vertical */
        justify-content: center; /* centra horizontal */

        gap: 12px; /* 🔥 espacio entre icono y texto */

        margin: 10px auto;
      }

      button:hover {
        background: #ba0915;
      }

      a {
        text-decoration: none; /* quita la línea */
        color: inherit; /* usa el color del botón */
      }

      p {
        color: #f5f5f5;
        font-family: "Montserrat", sans-serif;
        margin-left: 5%;
        margin-right: 5%;
      }

      i {
        font-size: 20px;
        color: #fff;
      }

      .orden {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
    </style>
  </head>
  <body>
    <!-- Imagen (puede ser tu logo) -->

    <img class="logo" src="donCarlos-blanco.webp" width="150" />

    <!-- Título -->
    <h1>Polleria Don Carlos | Brasas y Parrillas</h1>

    <p>
      El mejor pollo a la brasa, preparado con pasión y sabor que conquista.
    </p>

    <div class="orden">
      <!-- Tiktok -->
      <a
        href="https://www.tiktok.com/@pollosalabrasaparillasyp?_t=ZS-95twFtTcand"
      >
        <button>
          <i class="fa-brands fa-tiktok"></i> Visita nuestro Tik Tok
        </button>
      </a>

      <!-- Botón WhatsApp -->
      <a
        href="https://api.whatsapp.com/send?phone=51955517474&text=Hola+%2APolleria+Don+Carlos%2A%2C+quiero+hacer+un+pedido+por+favor."
      >
        <button><i class="fa-brands fa-whatsapp"></i> Realiza tu pedido</button>
      </a>

      <!-- Botón Ubicación -->
      <a href="CARTA-ONLINE-DON-CARLOS.pdf" target="_blank">
        <button><i class="fa-solid fa-utensils"></i> Nuestra Carta</button>
      </a>
    </div>
  </body>
</html>
